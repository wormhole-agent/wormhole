name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Why trufflehog instead of gitleaks-action?
# gitleaks-action requires a paid license when the runner is owned by a
# GitHub Organization. trufflehog has no such restriction and covers the
# same provider key formats (Anthropic, OpenAI, AWS, GitHub, etc).
jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
