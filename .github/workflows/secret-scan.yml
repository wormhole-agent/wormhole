name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Why trufflehog instead of gitleaks-action?
# gitleaks-action requires a paid license when the runner is owned by a
# GitHub Organization. trufflehog has no such restriction and covers the
# same provider key formats (Anthropic, OpenAI, AWS, GitHub, etc).
#
# On the FIRST push to a new repo there is no base ref to diff against
# (BASE == HEAD makes trufflehog crash). We scan the entire filesystem
# instead — `path: ./` with no base/head means "scan everything in the
# checkout". Once the repo has history, this is still a complete scan,
# just slightly slower than a diff scan. For a repo this size it's fine.
jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trufflehog (full filesystem scan)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --no-update
