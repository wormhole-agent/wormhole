# readability-exemptions.toml
#
# Scope matrix for the readability linter (referenced by CONTRIBUTING.md).
# Anything matched here is excluded from the readability rules. Their integrity
# is verified by the supply-chain manifest, not by code-quality gates.
#
# Voice rule: this file is human-readable; AI agents reading it should
# understand the intent, not just the patterns.

[exempt.vendor]
description = "Third-party code we did not write. Audited at dependency-pin time, not at line-by-line."
patterns = [
  "**/node_modules/**",
  "**/vendor/**",
  "**/third_party/**",
]

[exempt.generated]
description = "Code generated by build tools. Reviewers should look at the generator, not the output."
patterns = [
  "**/target/**",
  "**/build/credits-tier1-*.md",
  "**/build/credits-tier1-*.json",
  "**/*.generated.rs",
  "**/*.generated.js",
  "**/*.min.js",
  "**/*.min.css",
]

[exempt.fixtures]
description = "Test fixtures and sample data. Readability rules don't apply to JSON snapshots."
patterns = [
  "**/tests/fixtures/**",
  "**/tests/data/**",
  "**/openbrain/data/**",
]

[exempt.docs]
description = "Pure documentation. Readability is enforced editorially in CONTRIBUTING.md, not by the linter."
patterns = [
  "**/wiki/**",
  "**/*.md",
]

[severity]
# STRONG: blocks merge.
# WEAK: warning only.
strong = [
  "missing_module_docstring",
  "cryptic_name",
  "magic_number_in_complex_function",
  "long_unnamed_function",
]
weak = [
  "single_letter_outside_loop",
  "commented_out_code_block",
]

[exempt.reason_required]
# When a contributor needs a one-off exemption (e.g. a function that has to be
# 60 lines because it's a state machine), they add a `// readability-exempt:
# <reason>` comment on the line before. The linter records the exemption with
# the reason; the reason becomes part of the code review.
inline_marker = "readability-exempt:"
