[package]
name        = "wormhole"
version     = "0.1.1"
edition     = "2021"
authors     = ["The WormHole Project Contributors"]
description = "Local-first AI agent: Telegram + cron + multi-provider LLM."
license     = "Apache-2.0"
repository  = "https://github.com/wormhole-agent/wormhole"
readme      = "../README.md"

[[bin]]
name = "wormhole"
path = "src/main.rs"

[features]
default   = ["dashboard"]
dashboard = []

[dependencies]
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender   = "0.2"
chrono             = { version = "0.4", features = ["serde", "clock"] }
anyhow             = "1"
thiserror          = "2"
async-trait        = "0.1"
tokio-cron-scheduler = "0.13"
dirs               = "6"
once_cell          = "1"
uuid               = { version = "1", features = ["v4"] }
futures            = "0.3"
shell-escape       = "0.1"
regex              = "1"
axum               = "0.7"
tower-http         = { version = "0.6", features = ["cors", "fs"] }
url                = "2"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
